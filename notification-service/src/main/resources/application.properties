spring.application.name=campuscare-notification-service
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campuscare_notifications}
spring.datasource.username=${DB_USERNAME:campuscare}
spring.datasource.password=${DB_PASSWORD:campuscare-local-only}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

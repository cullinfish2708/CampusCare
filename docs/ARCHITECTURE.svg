<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<defs><style>.h{font:700 25px Arial;fill:#173746}.t{font:600 18px Arial;fill:#173746}.s{font:14px Arial;fill:#54717c}.box{fill:#fff;stroke:#b8d8ce;stroke-width:2;rx:18}.sub{fill:#eef8f4;stroke:#91cbb8;stroke-width:2;rx:12}.db{fill:#f5f2fc;stroke:#afa0d7;stroke-width:2}.arrow{stroke:#468f7b;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#468f7b"/></marker></defs>
<rect width="1200" height="650" fill="#f5f9f8"/><text x="60" y="58" class="h">CampusCare - logical system architecture</text><text x="60" y="86" class="s">Three-tier web application + independently deployed notification service</text>
<rect x="70" y="150" width="270" height="160" class="box"/><text x="205" y="190" text-anchor="middle" class="t">React frontend</text><text x="205" y="220" text-anchor="middle" class="s">Overview · Requests · Form</text><text x="205" y="244" text-anchor="middle" class="s">Details · Activity Log</text><text x="205" y="278" text-anchor="middle" class="s">Vite build / Nginx</text>
<rect x="460" y="130" width="310" height="195" class="box"/><text x="615" y="171" text-anchor="middle" class="t">Spring Boot main API</text><rect x="495" y="191" width="240" height="38" class="sub"/><text x="615" y="216" text-anchor="middle" class="s">REST Controllers</text><rect x="495" y="239" width="240" height="38" class="sub"/><text x="615" y="264" text-anchor="middle" class="s">Service / business logic</text><text x="615" y="304" text-anchor="middle" class="s">JPA repositories · Validation</text>
<rect x="870" y="125" width="260" height="185" class="box"/><text x="1000" y="168" text-anchor="middle" class="t">Notification service</text><text x="1000" y="200" text-anchor="middle" class="s">Independent Spring Boot API</text><text x="1000" y="224" text-anchor="middle" class="s">Event logging / service boundary</text><text x="1000" y="274" text-anchor="middle" class="s">Internal REST endpoint</text>
<path d="M340 230 H455" class="arrow"/><text x="398" y="213" text-anchor="middle" class="s">HTTPS / JSON</text><path d="M770 230 H865" class="arrow"/><text x="817" y="213" text-anchor="middle" class="s">REST event</text>
<rect x="460" y="435" width="310" height="130" class="db"/><text x="615" y="476" text-anchor="middle" class="t">PostgreSQL - campuscare_db</text><text x="615" y="510" text-anchor="middle" class="s">tickets · ticket_comments</text><text x="615" y="535" text-anchor="middle" class="s">One ticket → many comments</text><path d="M615 325 V430" class="arrow"/><text x="633" y="385" class="s">JPA</text>
<rect x="870" y="435" width="260" height="130" class="db"/><text x="1000" y="476" text-anchor="middle" class="t">PostgreSQL - notifications</text><text x="1000" y="510" text-anchor="middle" class="s">notification_events</text><text x="1000" y="535" text-anchor="middle" class="s">separate service database</text><path d="M1000 310 V430" class="arrow"/><text x="1018" y="385" class="s">JPA</text>
<text x="70" y="610" class="s">Note: no real email/SMS is sent in this academic demo. Add authentication, access controls and HTTPS policies before production use.</text></svg>

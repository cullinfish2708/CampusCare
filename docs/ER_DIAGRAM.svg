<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><defs><style>.h{font:700 25px Arial;fill:#173746}.t{font:700 18px Arial;fill:#173746}.f{font:14px Arial;fill:#506c77}.box{fill:white;stroke:#8fc6b4;stroke-width:2;rx:12}.line{stroke:#488f79;stroke-width:3;fill:none}.db{fill:#f4f0fb;stroke:#b2a3d8;stroke-width:2;rx:12}</style></defs><rect width="1100" height="560" fill="#f7faf9"/><text x="55" y="55" class="h">CampusCare - entity relationship model</text>
<rect x="75" y="130" width="390" height="320" class="box"/><text x="105" y="170" class="t">TICKET</text><path d="M100 185 H440" stroke="#d9e9e3"/><text x="105" y="220" class="f">PK  id : BIGINT</text><text x="105" y="250" class="f">UQ  ticket_code : VARCHAR(24)</text><text x="105" y="280" class="f">title, description</text><text x="105" y="310" class="f">category, priority, status</text><text x="105" y="340" class="f">location</text><text x="105" y="370" class="f">requester_name, requester_email</text><text x="105" y="400" class="f">assigned_team, created_at, updated_at</text><text x="105" y="430" class="f">resolved_at</text>
<rect x="635" y="130" width="390" height="260" class="box"/><text x="665" y="170" class="t">TICKET_COMMENT</text><path d="M660 185 H1000" stroke="#d9e9e3"/><text x="665" y="220" class="f">PK  id : BIGINT</text><text x="665" y="250" class="f">FK  ticket_id → TICKET.id</text><text x="665" y="280" class="f">author_name : VARCHAR(100)</text><text x="665" y="310" class="f">content : VARCHAR(1500)</text><text x="665" y="340" class="f">created_at, updated_at</text>
<path d="M465 285 H630" class="line"/><text x="548" y="268" text-anchor="middle" class="f">1 : N</text><text x="500" y="315" text-anchor="middle" class="f">CASCADE DELETE</text>
<rect x="350" y="475" width="400" height="60" class="db"/><text x="550" y="500" text-anchor="middle" class="t">SEPARATE DATABASE / SERVICE</text><text x="550" y="520" text-anchor="middle" class="f">NOTIFICATION_EVENT: id, recipient, subject, message, related_ticket_id, event_type, status, created_at</text></svg>

spring.application.name=campuscare-api
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campuscare_db}
spring.datasource.username=${DB_USERNAME:campuscare}
spring.datasource.password=${DB_PASSWORD:campuscare-local-only}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
app.notification-service-url=${NOTIFICATION_SERVICE_URL:http://localhost:8081}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}

spring.application.name=campuscare-api
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/campuscare_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
app.notification-service-url=${NOTIFICATION_SERVICE_URL:http://localhost:8081}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
